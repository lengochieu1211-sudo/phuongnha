name: V5.43 Finalize Source

on:
  push:
    branches:
      - release/v5.43.0-final

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'run v5.43 finalizer')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout final release branch
        uses: actions/checkout@v4
        with:
          ref: release/v5.43.0-final
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and verify audited final patch
        shell: bash
        run: |
          set -euo pipefail
          cat .release-final/part-*.b64 | tr -d '\r\n ' | base64 -d > /tmp/v543-final.patch.gz
          echo "4bde97637aba0ac4a8879c7ec82fa261096d15fee1a715981a4c33bb1d35356a  /tmp/v543-final.patch.gz" | sha256sum -c -
          gunzip -c /tmp/v543-final.patch.gz > /tmp/v543-final.patch
          echo "7146f29f30fde9901f820b774abb4595a8a259ccd37c2caa860f36402f31029c  /tmp/v543-final.patch" | sha256sum -c -
          git apply --check /tmp/v543-final.patch
          git apply /tmp/v543-final.patch
          git diff --check
          rm -rf .release-final

      - name: Preinstall static release gate
        run: node src/scripts/releaseGateStatic.mjs

      - name: Install deterministic dependencies
        run: npm ci --no-audit --no-fund

      - name: Release gate TypeScript assets voice
        run: npm run check

      - name: Production build
        run: npm run build -- --base=/phuongnha/

      - name: Commit certified final source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist
          # The Actions token may not modify workflow files. Keep both workflow files byte-identical
          # to this branch during the bot push; the authenticated repo connection updates/removes them next.
          git restore --source=HEAD -- .github/workflows/deploy.yml .github/workflows/v543-finalize-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v5.43.0 final runtime golden and version notes"
          git push origin HEAD:release/v5.43.0-final
