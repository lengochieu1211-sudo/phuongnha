name: V5.43 Runtime Golden

on:
  push:
    branches:
      - runtime/v5.43-golden
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply audited WebGL fallback patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .runtime/v543-webgl-fallback.patch.b64 > /tmp/v543-webgl-fallback.patch
          git apply --check /tmp/v543-webgl-fallback.patch
          git apply /tmp/v543-webgl-fallback.patch
          echo "b0739d33ffa9a0988c8f9c9d0abbd0f2b0e90d7f4ef8762e17c6db0cdcbb247b  src/components/racing/GarageScreen.tsx" | sha256sum -c -
          echo "18d5bb2bff35634e14b1524f7aff5b40e465943e3346004d217b6eec23ee2066  src/components/racing/Race3DCanvas.tsx" | sha256sum -c -
          git diff --check
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Release checks
        run: npm run check
      - name: Build
        run: npm run build -- --base=/phuongnha/
      - name: Start Vite preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/v543-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/phuongnha/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/v543-preview.log
          exit 1
      - name: Browser prerequisites
        shell: bash
        run: |
          set -euo pipefail
          which google-chrome || which chromium || which chromium-browser
          python -m pip install --disable-pip-version-check --quiet selenium
      - name: Verify no-WebGL graceful fallback
        env:
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-golden-artifacts
          python - <<'PY'
          import json, traceback
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          URL='http://127.0.0.1:4173/phuongnha/'
          out='runtime-golden-artifacts'
          results=[]

          def make_driver(width,height):
              o=Options()
              for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required','--use-fake-device-for-media-stream','--use-fake-ui-for-media-stream']:
                  o.add_argument(a)
              o.set_capability('goog:loggingPrefs',{'browser':'ALL'})
              d=webdriver.Chrome(options=o); d.set_window_size(width,height); return d

          def click_id(d, id, timeout=30):
              e=WebDriverWait(d,timeout).until(EC.element_to_be_clickable((By.ID,id)))
              d.execute_script('arguments[0].scrollIntoView({block:"center"});',e); e.click()

          failed=False
          for label,w,h in [('desktop',1440,900),('mobile',390,844)]:
              d=make_driver(w,h); case={'label':label,'status':'PASS','checks':[]}
              try:
                  d.get(URL)
                  WebDriverWait(d,30).until(EC.presence_of_element_located((By.ID,'home-card-racing'))); case['checks'].append('home-load')
                  click_id(d,'home-card-racing')
                  WebDriverWait(d,30).until(EC.presence_of_element_located((By.ID,'racing-hub-screen'))); case['checks'].append('racing-hub')
                  d.get_log('browser')
                  click_id(d,'mode-garage-card')
                  WebDriverWait(d,15).until(EC.presence_of_element_located((By.ID,'garage-showroom-screen')))
                  fallback=WebDriverWait(d,15).until(EC.presence_of_element_located((By.ID,'garage-webgl-fallback')))
                  if not fallback.is_displayed(): raise AssertionError('Garage WebGL fallback not visible')
                  if not d.find_element(By.ID,'garage-back-btn').is_displayed(): raise AssertionError('Garage back control missing')
                  if not d.find_element(By.ID,'garage-next-car-btn').is_displayed(): raise AssertionError('Garage car controls missing')
                  case['checks'] += ['garage-root-survives-webgl-failure','garage-fallback-visible','garage-controls-alive']
                  d.save_screenshot(f'{out}/{label}-garage-webgl-fallback.png')
                  click_id(d,'garage-back-btn')
                  WebDriverWait(d,15).until(EC.presence_of_element_located((By.ID,'racing-hub-screen'))); case['checks'].append('garage-exit-works')
                  logs=d.get_log('browser')
                  uncaught=[x for x in logs if x.get('level')=='SEVERE' and 'Uncaught Error: THREE.WebGLRenderer' in x.get('message','')]
                  if uncaught: raise AssertionError('uncaught WebGL exception still escaped Garage')
              except Exception as e:
                  case['status']='FAIL'; case['error']=str(e); failed=True
                  d.save_screenshot(f'{out}/{label}-FAIL.png'); traceback.print_exc()
              finally:
                  results.append(case); d.quit()
          with open(f'{out}/no-webgl-fallback-results.json','w',encoding='utf-8') as f: json.dump(results,f,ensure_ascii=False,indent=2)
          print(json.dumps(results,ensure_ascii=False,indent=2))
          if failed: raise SystemExit(1)
          PY
      - name: Upload Runtime Golden evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5.43-runtime-golden-evidence
          path: runtime-golden-artifacts/
          if-no-files-found: warn
          retention-days: 7
